<!DOCTYPE html>
<html>

<head>
  <!--====================================================
                    META INFORMATION
  =====================================================-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Professionnel</title>

  <!--====================================================                      STYLESHEETS
  ====================================================-->
  <link rel="stylesheet" href="styles/generale.css">
  <link rel="stylesheet" href="styles/project/header.css">

  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/project/projects.css">
  <link rel="stylesheet" href="styles/project/responsive.css">
  <link rel="stylesheet" href="styles/show.css">




</head>

<body>

  <!-- ========================================================
    HEADER
    Logo - Navigation - Theme Switch - Download CV
  =====================================================-->
  <header>
    <!-- Header Container -->
    <div class="header-container">
      <!-- Logo -->
      <div class="header-left">
        <p class="logo">
          Fatima
          <span class="logoname">Khilat</span>

          <span class="dot">
          </span>
        </p>
      </div>
      <!-- Navigation Menu -->
      <nav class="header-midle">


        <ul class="midle-item js-midle-item">
          <li class="item"> <a href="#hero">Home</a> </li>
          <li class="item"> <a href="#about">About</a> </li>
          <li class="item"> <a href="#skills">Skills</a> </li>
          <li class="item"> <a href="#projects">Projects</a> </li>
          <li class="item"> <a href="#footer">Contact</a> </li>
        </ul>

      </nav>
      <!-- Theme Button + Download CV -->
      <div class="header-right">
        <div class="moon-item js-moon-item">
          <img src="icons/moon.svg" alt="Moon">
        </div>
        <a href="cv/CV Fatima Khilat.pdf" download class="download-button">

          <span class="dow-name">
            Download CV
          </span>

          <img src="icons/download.svg" class="icon-img" alt="Download">

        </a>
      </div>
    </div>
  </header>

  <main>

    <section id="projects">
      <div class="projects-container">

        <!--==============================================
                  Section Title + Filter Buttons
             ==========================================-->
        <div class="projects-header">
          <!-- Section Title -->
          <div class="section-title">
            <h2 class="project-title">My Projects
              <strong class="dot5"></strong>
            </h2>

            <p class="describe-title">
              Selected projects built with Java,
              <br>
              Spring Boot,React and modern web technologies.
            </p>
          </div>
          <div class="btn-header">
            <div class="projects-filter js-projects-filter">


              <button class="filter-btn1 js-filter-btn" data-filter="all" data-name="All">
                All
              </button>

              <button class="filter-btn js-filter-btn" data-filter="frontend" data-name="Frontend">
                Frontend
              </button>

              <button class="filter-btn js-filter-btn" data-filter="backend" data-name="Backend">
                Backend
              </button>

              <button class="filter-btn js-filter-btn" data-filter="fullstack" data-name="Fullstack">
                Full Stack
              </button>

              <button class="filter-btn js-filter-btn" data-filter="springboot" data-name="Spring Boot">
                Spring Boot
              </button>

              <button class="filter-btn js-filter-btn" data-filter="react" data-name="React">
                React
              </button>

              <button class="filter-btn js-filter-btn" data-filter="cloud" data-name="Cloud">
                Cloud
              </button>

              <!-- bouton visible -->
            </div>

            <button class="filter-btn2 js-filter-btn2">
              <span class="dot1"></span>
              <span class="dot1"></span>
              <span class="dot1"></span>
            </button>
          </div>
        </div>


        <div class="projects-grid js-projects-grid">
        </div>


      </div>
    </section>





</body>

</html>
